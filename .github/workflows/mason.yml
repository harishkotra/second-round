name: Mason

# Implements the next ready requirement. Opens a branch and a pull request.
# Never main, never a merge, never an approval.
#
# The schedule is what makes the crew autonomous rather than merely capable. It
# finds the next issue labelled `ready` that no other builder holds, takes the
# label lease, and builds it. `workflow_dispatch` with an issue number still
# works when a specific requirement should be forced.
#
# There is deliberately no `issues: [assigned]` trigger. It was here and it could
# never fire: GitHub Apps are not assignable, and Foreman only applies labels, so
# the assignee it waited for was never going to exist.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to implement (blank takes the next ready one)'
        required: false
        type: string

concurrency:
  group: bot-sr-mason
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mason:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.APP_SR_MASON_CLIENT_ID }}
          private-key: ${{ secrets.APP_SR_MASON_PRIVATE_KEY }}

      - name: Run Mason
        run: node dist/src/bots/mason.js
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          PARTICLE_API_KEY: ${{ secrets.PARTICLE_API_KEY }}
          PARTICLE_BASE_URL: ${{ vars.PARTICLE_BASE_URL }}
          BOT_DAILY_CAP_USD: '0.50'